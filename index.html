<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Форма дежурства</title>
    <!-- Подключаем скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Сбрасываем отступы, чтобы форма заняла весь экран */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--tg-theme-bg-color, #ffffff);
        }
        /* Растягиваем iframe на весь экран */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();   // Сообщаем Telegram, что приложение готово
        tg.expand();  // Разворачиваем на весь экран
    </script>
    
    <!-- Вставляем вашу Google Форму -->
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc1St-kQS_oxuWcRC-OPpfx8SMVWYBoSekThNNr7YPdq7eJ7w/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Загрузка…</iframe>
</body>
</html>
